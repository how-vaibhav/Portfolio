<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#E84419" />
    </linearGradient>
    <linearGradient id="vAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(232, 68, 25, 0.35)" stroke-width="2" />

  <!-- Left wing of V (White accent) -->
  <path d="M16 16 L25 16 L32 38 L27 48 Z" fill="url(#vAccent)" />

  <!-- Right wing of V (Signature Orange) with glow -->
  <path d="M48 16 L39 16 L27 48 L35 48 Z" fill="url(#vGrad)" filter="url(#glow)" />

  <!-- Center subtle spark/dot -->
  <circle cx="32" cy="18" r="2" fill="#E84419" opacity="0.8" />
</svg>
